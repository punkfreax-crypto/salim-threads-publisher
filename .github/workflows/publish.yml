name: publish
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: loop
        env:
          TOK_SALIM: ${{ secrets.THREADS_ACCESS_TOKEN }}
          UID_SALIM: ${{ secrets.THREADS_USER_ID }}
          ISS_SALIM: ${{ secrets.THREADS_TOKEN_ISSUED }}
          TOK_KITCHEN: ${{ secrets.THREADS_ACCESS_TOKEN_KITCHEN }}
          UID_KITCHEN: ${{ secrets.THREADS_USER_ID_KITCHEN }}
          ISS_KITCHEN: ${{ secrets.THREADS_TOKEN_ISSUED_KITCHEN }}
          TOK_SEASON: ${{ secrets.THREADS_ACCESS_TOKEN_SEASON }}
          UID_SEASON: ${{ secrets.THREADS_USER_ID_SEASON }}
          ISS_SEASON: ${{ secrets.THREADS_TOKEN_ISSUED_SEASON }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "salim-bot"; git config user.email "bot@users.noreply.github.com"
          START=$(date +%s)
          while [ $(( $(date +%s) - START )) -lt 19500 ]; do
            git fetch -q origin main && git reset -q --hard origin/main
            touch server_run.log
            H=$(TZ=Asia/Seoul date +%H)
            if [ "$H" -ge 7 ]; then
              for A in salim kitchen season; do
                U=$(echo $A | tr a-z A-Z)
                TOK=$(eval echo \$TOK_$U); UID_=$(eval echo \$UID_$U); ISS=$(eval echo \$ISS_$U)
                [ -z "$TOK" ] && continue
                if [ "$A" = salim ]; then D=.; SUF=""; else D=accounts/$A; SUF="_$U"; fi
                printf "THREADS_ACCESS_TOKEN=%s\nTHREADS_USER_ID=%s\nTHREADS_TOKEN_ISSUED=%s\n" "$TOK" "$UID_" "$ISS" > $D/.secrets.env
                OUT=$(ACCOUNT=$A python3 threads_bot.py run 2>&1) || OUT="$OUT [실행 오류]"
                if echo "$OUT" | grep -qE "발행:|실패|오류|갱신 완료"; then echo "=== [$A] $(TZ=Asia/Seoul date '+%F %T')" >> server_run.log; echo "$OUT" >> server_run.log; fi
                NEW=$(grep '^THREADS_ACCESS_TOKEN=' $D/.secrets.env | cut -d= -f2-)
                if [ "$NEW" != "$TOK" ]; then
                  gh secret set THREADS_ACCESS_TOKEN$SUF --body "$NEW"
                  gh secret set THREADS_TOKEN_ISSUED$SUF --body "$(grep '^THREADS_TOKEN_ISSUED=' $D/.secrets.env | cut -d= -f2-)"
                  eval "TOK_$U=\$NEW"
                fi
                rm -f $D/.secrets.env
              done
            fi
            echo "$(TZ=Asia/Seoul date '+%F %T')" > server_heartbeat.txt
            tail -n 400 server_run.log > s.tmp && mv s.tmp server_run.log
            git add -A queue.json posted_log.json server_run.log server_heartbeat.txt accounts
            if ! git diff --cached --quiet; then
              git commit -qm "publish $(TZ=Asia/Seoul date '+%F %H:%M')"
              for i in 1 2 3 4; do
                git push -q origin HEAD:main && break
                python3 server_merge.py save; git fetch -q origin main; git reset -q --hard origin/main
                python3 server_merge.py apply; git add -A queue.json posted_log.json accounts
                git commit -qm "publish(merge) $(TZ=Asia/Seoul date '+%F %H:%M')" || true
                sleep 3
              done
            fi
            sleep 600
          done
      - name: chain next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh workflow run publish.yml --ref main -R ${{ github.repository }} || true
